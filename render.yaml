services:
  - type: web
    name: gmiu-ala1-cloud-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gmiu-ala1-db
          property: connectionString

databases:
  - name: gmiu-ala1-db
    plan: free
